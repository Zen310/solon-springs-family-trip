<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Solon Springs">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Solon Springs Route Map</title>
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #171f1c;
      color: #fff8e8;
      font-family: "Avenir Next", Avenir, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }

    .stage {
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 0;
      background: #171f1c;
      position: relative;
      overflow: auto;
    }

    img {
      width: 100vw;
      height: auto;
      object-fit: contain;
      display: block;
      touch-action: pinch-zoom;
      user-select: none;
      -webkit-user-select: none;
    }

    .back,
    .hint,
    .install {
      position: fixed;
      z-index: 2;
      border: 2px solid rgba(255, 248, 232, .72);
      border-radius: 8px;
      background: rgba(23, 31, 28, .82);
      color: #fff8e8;
      backdrop-filter: blur(8px);
    }

    .back {
      top: max(12px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      padding: 8px 12px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 950;
    }

    .hint {
      left: 50%;
      bottom: max(12px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: min(92vw, 520px);
      padding: 8px 12px;
      text-align: center;
      font-size: 13px;
      font-weight: 850;
    }

    .install {
      right: max(12px, env(safe-area-inset-right));
      bottom: max(12px, env(safe-area-inset-bottom));
      max-width: min(56vw, 360px);
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 850;
      line-height: 1.28;
      opacity: .9;
    }

    @media (max-width: 700px) and (orientation: portrait) {
      body,
      .stage {
        overflow: hidden;
      }

      img {
        position: absolute;
        top: 50%;
        left: 50%;
        width: min(100svh, calc(100vw * 16 / 9));
        height: auto;
        max-width: none;
        max-height: none;
        transform: translate(-50%, -50%) rotate(90deg);
      }
    }

    @media (orientation: landscape) {
      .stage {
        height: auto;
        min-height: 100vh;
        min-height: 100svh;
        display: block;
        overflow: visible;
        padding: 0;
      }

      img {
        width: 100vw;
        height: auto;
        max-width: none;
        max-height: none;
        object-fit: fill;
      }

      .back {
        display: none;
      }

      .hint {
        display: none;
      }

      .install {
        left: 10px;
        right: auto;
        bottom: 10px;
        max-width: 44vw;
        font-size: 11px;
        opacity: .76;
      }
    }

    @media (display-mode: fullscreen), (display-mode: standalone) {
      .install { display: none; }

      .back {
        opacity: .62;
      }
    }
  </style>
</head>
<body>
  <a class="back" href="index.html#map">Back</a>
  <main class="stage" aria-label="Full-screen Solon Springs route map">
    <img src="favorite-03-16x9-current-best.jpg" alt="Full-screen illustrated Solon Springs Run route map.">
  </main>
  <div class="hint">Best phone view: keep it upright. The map is rotated here so it fills the screen.</div>
  <div class="install">True no-browser-bar view: Share button -> Add to Home Screen, then open from the new icon.</div>
</body>
</html>
